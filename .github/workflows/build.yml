name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: crate-service
            db: crate_db
          - service: reward-service
            db: reward_db
          - service: opening-service
            db: opening_db
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.db }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CRATE_DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.db }}
      REWARD_DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.db }}
      OPENING_DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: gradle
      - name: Test ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: ./gradlew test
