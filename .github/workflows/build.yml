name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [crate-service, reward-service, opening-service]
    env:
      CRATE_SERVICE_BASE_URL: http://localhost:8080
      REWARD_SERVICE_BASE_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Test ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: ./gradlew test
