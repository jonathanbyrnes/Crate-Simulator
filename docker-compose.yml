services:
  kafka:
    image: "apache/kafka:4.3.1"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  postgres-crate:
    image: "postgres:18"
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: crate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_crate:/var/lib/postgresql

  postgres-reward:
    image: "postgres:18"
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: reward_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata_reward:/var/lib/postgresql

  postgres-opening:
    image: "postgres:18"
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: opening_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata_opening:/var/lib/postgresql

  crate-service:
    build:
      context: ./backend/crate-service
      dockerfile: Dockerfile
    depends_on:
      - postgres-crate
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${CRATE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

  reward-service:
    build:
      context: ./backend/reward-service
      dockerfile: Dockerfile
    depends_on:
      - postgres-reward
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${REWARD_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CRATE_SERVICE_BASE_URL: http://crate-service:8080
    ports:
      - "8082:8080"

  opening-service:
    build:
      context: ./backend/opening-service
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - postgres-opening
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${OPENING_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      REWARD_SERVICE_BASE_URL: http://reward-service:8080
    ports:
      - "8081:8080"

volumes:
  pgdata_crate:
  pgdata_reward:
  pgdata_opening: